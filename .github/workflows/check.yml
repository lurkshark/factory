name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      # PROJECT TOOLCHAIN: add language setup and dependency install steps here.
      - run: uv run --project tools --locked python -m unittest discover -s tools/tests -t tools
        env: { PYTHONPATH: tools }
      - run: tools/spec check
      - name: Coverage for every module
        run: |
          set -e
          for d in packages/*/; do
            [ -d "$d" ] || continue
            tools/spec coverage "$(basename "$d")"
          done
          if grep -q '^evals:' SYSTEM.md; then tools/spec coverage system; fi
      - name: History checks
        if: github.event_name == 'pull_request'
        run: tools/spec check-commits "origin/${{ github.base_ref }}..HEAD"
